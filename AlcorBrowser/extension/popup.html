<!doctype html>
<!--
  AlcorBrowser popup markup and styles. All behaviour lives in popup.js (Chrome's content security
  policy for extension pages forbids inline scripts), which fills the elements by id.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AlcorBrowser</title>
    <style>
      :root {
        --bg: #fbfbfa;
        --card: #ffffff;
        --ink: #1b1d21;
        --mute: #6b7079;
        --line: #e6e6e3;
        --accent: #3a5bd9;
        --ok: #1f8a4c;
        --warn: #b7791f;
        --bad: #c0392b;
        --chip: #f1f2f4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15171b;
          --card: #1d2026;
          --ink: #e8e9ec;
          --mute: #9aa0aa;
          --line: #2c3038;
          --accent: #7d97ff;
          --ok: #3ccf7f;
          --warn: #e2a33a;
          --bad: #ff6b5e;
          --chip: #262a31;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 340px;
        background: var(--bg);
        color: var(--ink);
        font:
          13px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px 10px;
      }
      .mark {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent), #8a5bd9);
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 700;
        font-size: 14px;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0.1px;
      }
      .sub {
        color: var(--mute);
        font-size: 11.5px;
      }
      .dot {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--mute);
      }
      .dot i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--mute);
        display: inline-block;
      }
      .dot.ok i {
        background: var(--ok);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent);
      }
      .dot.bad i {
        background: var(--bad);
      }
      main {
        padding: 0 12px 12px;
        display: grid;
        gap: 10px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .card h2 {
        margin: 0 0 6px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--mute);
        font-weight: 600;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 12px;
      }
      .k {
        color: var(--mute);
        font-size: 11.5px;
      }
      .v {
        font-weight: 550;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }
      .update {
        border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
      }
      .update.none {
        border-color: var(--line);
      }
      .ver {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .ver .big {
        font-size: 16px;
        font-weight: 650;
      }
      .badge {
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 999px;
        background: var(--chip);
        color: var(--mute);
      }
      .badge.new {
        background: color-mix(in srgb, var(--accent) 16%, transparent);
        color: var(--accent);
      }
      ul.notes {
        margin: 6px 0 0;
        padding-left: 16px;
        color: var(--ink);
      }
      ul.notes li {
        margin: 2px 0;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      button {
        flex: 1;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 8px;
        padding: 7px 8px;
        font: inherit;
        font-weight: 550;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--mute);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .act {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 3px;
      }
      .act li {
        display: grid;
        grid-template-columns: 42px 44px 1fr 14px;
        gap: 6px;
        font-size: 12px;
        align-items: center;
      }
      .act .t,
      .act .a {
        color: var(--mute);
      }
      .act .tool {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .act .r.ok {
        color: var(--ok);
      }
      .act .r.bad {
        color: var(--bad);
      }
      .empty {
        color: var(--mute);
        font-size: 12px;
      }
      .msg {
        font-size: 12px;
        color: var(--mute);
        min-height: 16px;
        padding: 0 4px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="mark">A</div>
      <div>
        <h1>AlcorBrowser</h1>
        <div class="sub" id="installed">…</div>
      </div>
      <div class="dot" id="conn"><i></i><span>…</span></div>
    </header>
    <main>
      <section class="card update none" id="updateCard">
        <h2>Updates</h2>
        <div class="ver">
          <span class="big" id="avail">—</span><span class="badge" id="updBadge">checking</span>
        </div>
        <div class="sub" id="published"></div>
        <ul class="notes" id="notes"></ul>
        <div class="row">
          <button class="primary" id="btnUpdate" disabled>Update</button>
          <button id="btnRestart">Restart</button>
          <button id="btnReload">Reload</button>
        </div>
      </section>
      <section class="card">
        <h2>Link</h2>
        <div class="grid">
          <div>
            <div class="k">Broker</div>
            <div class="v" id="broker">—</div>
          </div>
          <div>
            <div class="k">Update source</div>
            <div class="v" id="channelKind">—</div>
          </div>
          <div>
            <div class="k">Profile</div>
            <div class="v" id="profile">—</div>
          </div>
          <div>
            <div class="k">Tabs named</div>
            <div class="v" id="tabs">—</div>
          </div>
        </div>
      </section>
      <section class="card">
        <h2>Recent agent activity</h2>
        <ul class="act" id="activity">
          <li class="empty">—</li>
        </ul>
      </section>
      <div class="msg" id="msg"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>

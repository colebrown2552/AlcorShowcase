[package]
name = "alcor-design"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local design workspace for editing the rendered DOM of real websites"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
uuid = { version = "1", features = ["v4"] }
scraper = "0.29"
url = "2"
walkdir = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = "thin"
